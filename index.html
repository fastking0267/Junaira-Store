/* ===== MY GROCERY design system =====
Type 12/14/16/18/24 · weights 400/500/700 · spacing 4-pt (4/8/12/16/24)
Radius: 8 controls · 12 containers · 16 sheet · pill chips/switch · No shadows (outlines only) */
:root{--bg:#F7F4F8;--fg:#2E2633;--m:#6F6375;--ln:#E6DDEB;--cd:#FFFDFF;--on-brand:var(--cd);--on-warning:var(--fg);--sf:#F0EAF4;--brand:#754B8C;--brand-pressed:#59386D;--r:#B94F43;--g:#39845C;--y:#E69A3A;--bl:#216F96;--danger:#B94F43;--danger-pressed:#963D34;--success:#39845C;--success-pressed:#286B49;--warning:#E69A3A;--warning-pressed:#C77D25;--info:#216F96;--info-pressed:#195775;--success-bg:#EAF2E9;--warning-bg:#F8EEDF;--danger-bg:#F5E9E5;--info-bg:#EAF0F1;--success-border:#B8D2B8;--warning-border:#E8C78F;--danger-border:#E2B8AE;--info-border:#B8CCD3;--scrim:rgba(0,0,0,.45);
--fs-xs:12px;--fs-sm:14px;--fs-md:16px;--fs-lg:18px;--fs-20:18px;--fs-xl:24px;--lh-tight:1.25;--lh-body:1.5;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--rad-xs:8px;--rad-sm:8px;--rad-md:8px;--rad-lg:8px;--rad-pill:8px;--ctl:48px;--field:56px;--ic:24px;--ic-sm:20px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:var(--fs-md)/var(--lh-body) 'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;-webkit-text-size-adjust:100%}
b{font-weight:700}h3{font-size:var(--fs-20);font-weight:700;line-height:var(--lh-tight);margin:0}
small,.m{color:var(--m);font-size:var(--fs-sm);line-height:var(--lh-body)}
.r{color:var(--r)}.g{color:var(--g)}.y{color:var(--y)}.bl{color:var(--bl)}
.mi{width:var(--ic);height:var(--ic);flex:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}input:focus,input:focus-visible,select:focus{outline:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* layout */
header{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);border-bottom:1px solid var(--ln)}
header b{flex:1;display:flex;align-items:center;gap:var(--s1);min-height:var(--ic);position:relative;top:-.5px;font-size:var(--fs-20);line-height:var(--lh-tight)}.store-mark{width:36px;height:36px;object-fit:contain;display:block;flex:none}
header button,.bb,.db>button{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none}
#app{padding:var(--s4) var(--s4) 96px;max-width:560px;margin:auto}
#app,.stk{display:flex;flex-direction:column;gap:var(--s2)}
#app>*,.stk>*{margin:0}
#app>h3,.stk>h3{margin:var(--s5) 0 0}#app>h3:first-child,.stk>h3:first-child,#app>.bb+h3{margin-top:0}
